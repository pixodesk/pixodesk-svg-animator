<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Get started — from code, the JSON inside the page</title>
  </head>
  <body>
    <div id="hero" style="width: 300px; height: 300px"></div>

    <script type="application/json" id="hero-animation">
      {
        "type": "svg",
        "viewBox": "0 0 400 400",
        "animator": {
          "timeline": {
            "outTime": 1000,
            "trigger": {
              "start": "load",
              "offScreen": "continue"
            },
            "iterations": "infinite",
            "direction": "alternate"
          }
        },
        "children": [
          {
            "type": "circle",
            "id": "ball",
            "cx": 0,
            "cy": 0,
            "r": 40,
            "fill": "#0087ff",
            "animate": {
              "transform": {
                "keyframes": [
                  {
                    "time": 0,
                    "value": {
                      "translate": [
                        200,
                        60
                      ]
                    },
                    "easing": [
                      0.33,
                      0,
                      0.67,
                      0.33
                    ]
                  },
                  {
                    "time": 1000,
                    "value": {
                      "translate": [
                        200,
                        340
                      ]
                    }
                  }
                ]
              }
            }
          }
        ]
      }
    </script>

    <script src="js/pixodesk-svg-animator.umd.min.js"></script>
    <script>
      const doc = JSON.parse(document.getElementById('hero-animation').textContent);
      Pixodesk.SvgAnimator.create({ doc, container: '#hero', playAsSaved: true });
    </script>
  </body>
</html>
