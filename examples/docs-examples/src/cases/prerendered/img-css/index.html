<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>In an img — static</title>
    <link rel="stylesheet" href="../../../case.css" />
  </head>
  <body>
    <h1>In an <code>&lt;img&gt;</code> — static</h1>
    <p class="summary">Used as a picture — <code>&lt;img src&gt;</code>, SVG <code>&lt;image&gt;</code>, CSS <code>background-image</code> — a pre-rendered SVG shows a still frame: no script runs inside an image, and the page cannot reach in to add the play classes. This is the same file the inline case plays. Inline it instead.</p>
    <img id="raw" class="stage" src="../../../../animation.svg" alt="a pre-rendered SVG as an image: static" />
  </body>
</html>
