<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Callbacks</title>
    <link rel="stylesheet" href="../../../case.css" />
  </head>
  <body>
    <h1>Callbacks</h1>
    <p class="summary">Every lifecycle callback, logged as it fires. Play, pause, resume, then skip near the end to see it finish.</p>
    <div class="controls">
      <button id="play">playback.start()</button>
      <button id="pause">playback.pause()</button>
      <button id="resume">playback.resume()</button>
      <button id="stop">playback.stop()</button>
      <button id="finish">playback.setCurrentProgress(1.9) + play()</button>
      <button id="destroy">destroy()</button>
    </div>
    <div class="row">
      <div id="box" class="stage"></div>
      <pre id="log" class="log"></pre>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
