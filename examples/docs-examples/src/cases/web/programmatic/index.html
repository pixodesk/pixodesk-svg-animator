<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Programmatic — createSvgAnimationPlayer + playback API</title>
    <link rel="stylesheet" href="../../../case.css" />
  </head>
  <body>
    <h1>Programmatic — createSvgAnimationPlayer + playback API</h1>
    <p class="summary"><code>createSvgAnimationPlayer({ document, container })</code> returns the playback API. Control calls made before the file has loaded are queued.</p>
    <div class="controls">
      <button id="start">timeline.start()</button>
      <button id="play">timeline.play()</button>
      <button id="pause">timeline.pause()</button>
      <button id="stop">timeline.stop()</button>
      <button id="reverse">timeline.setSpeed(-1)</button>
      <button id="normal">timeline.setSpeed(1)</button>
      <label>jump to <input id="time-slider" type="range" min="0" max="2000" value="0" /> <span id="ms">0</span> ms</label>
    </div>
    <div id="box" class="stage"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
