name: Publish to npm

on:
  # Trigger on GitHub release creation
  release:
    types: [published]
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Every publishable package lives in packages/* and is versioned in
      # lockstep. Path filtering means a new package is picked up automatically
      # — no per-package list to forget to update. Example apps live in
      # examples/* and are all marked `"private": true`, so they can never be
      # published even by a recursive command.
      - name: Set version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          # Update version in all publishable packages (skip if already set)
          CURRENT=$(node -p "require('./packages/svg-animator-web/package.json').version")
          if [ "$CURRENT" != "$VERSION" ]; then
            pnpm --filter "./packages/*" exec pnpm version "$VERSION" --no-git-tag-version
          else
            echo "Version already $VERSION — skipping bump"
          fi

      - name: Build packages
        run: pnpm --filter "./packages/*" run build

      - name: Typecheck packages
        run: pnpm --filter "./packages/*" run typecheck

      - name: Test packages
        run: pnpm --filter "./packages/*" run test

      # `pnpm publish -r` walks the workspace in TOPOLOGICAL order, so
      # svg-animator-core goes out before svg-animator-web / -rn, which declare
      # it as a dependency. Publishing web before core would put a package on
      # the registry whose dependency does not exist yet.
      # Private packages (all of examples/*) are skipped automatically, and
      # versions already on the registry are skipped rather than failing — so
      # re-running a partially-failed release is safe.
      - name: Publish packages
        run: pnpm publish -r --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
