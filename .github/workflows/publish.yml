name: Publish to npm

on:
  # Trigger on GitHub release creation
  release:
    types: [published]
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Every publishable package lives in packages/* and is versioned in
      # lockstep. Path filtering means a new package is picked up automatically
      # — no per-package list to forget to update. Example apps live in
      # examples/* and are all marked `"private": true`, so they can never be
      # published even by a recursive command.
      - name: Set version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          # Update version in all publishable packages (skip if already set)
          CURRENT=$(node -p "require('./packages/svg-animator-web/package.json').version")
          if [ "$CURRENT" != "$VERSION" ]; then
            pnpm --filter "./packages/*" exec pnpm version "$VERSION" --no-git-tag-version
          else
            echo "Version already $VERSION — skipping bump"
          fi

      - name: Build packages
        run: pnpm --filter "./packages/*" run build

      - name: Typecheck packages
        run: pnpm --filter "./packages/*" run typecheck

      - name: Test packages
        run: pnpm --filter "./packages/*" run test

      # Publishes ONE package at a time, in the workspace's TOPOLOGICAL order
      # (core → rn → web → react → vue), so a package never reaches the registry
      # before a workspace dependency it declares. `--workspace-concurrency=1`
      # keeps that order strict; private packages (all of examples/*) are
      # filtered out by the path.
      #
      # This replaced a plain `pnpm publish -r`, which ABORTS the entire run on
      # the first error. Its already-published check reads the registry, and
      # registry reads are only eventually consistent: re-running a release
      # shortly after a partial one, the check still saw the version as absent,
      # tried to republish, and npm rejected the write with
      #   403 You cannot publish over the previously published versions
      # — taking the four not-yet-published packages down with it. Checking and
      # skipping per package is what makes a re-run actually recover; a genuine
      # failure still fails the step.
      - name: Publish packages
        run: |
          pnpm --filter "./packages/*" --workspace-concurrency=1 exec sh -c '
            name=$(node -p "require(\"./package.json\").name")
            version=$(node -p "require(\"./package.json\").version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip     $name@$version — already on the registry"
            else
              echo "publish  $name@$version"
              pnpm publish --access public --no-git-checks --provenance
            fi
          '
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
