name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # examples/docs-examples runs Playwright as its `test` script, and `build`
      # depends on `test` — so the example tests gate the whole build here too.
      - run: pnpm exec playwright install --with-deps chromium

      # turbo picks up every workspace package automatically, so new packages
      # (svg-animator-core, svg-animator-rn) are covered without changes here.
      - run: pnpm build

      # `build` only runs eslint + a bundler; neither fails on type errors.
      # Without this step type breakage reaches main silently.
      - run: pnpm typecheck

      - run: pnpm test
