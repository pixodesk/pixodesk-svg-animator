name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # examples/docs-examples runs Playwright as its `test` script, and `build`
      # depends on `test` — so the example tests gate the whole build here too.
      # Playwright is a dependency of that package, not of the workspace root, so
      # the install must run inside it (a root `pnpm exec` cannot find the binary).
      - run: pnpm --filter @pixodesk/example-docs-examples exec playwright install --with-deps chromium

      # turbo picks up every workspace package automatically, so new packages
      # (svg-animator-core, svg-animator-rn) are covered without changes here.
      # It ends with `check:get-started --local`: the Get started example projects, installed
      # from the PACKED workspace packages and opened in a browser — the release about to go out.
      - run: pnpm build

      # `build` only runs eslint + a bundler; neither fails on type errors.
      # Without this step type breakage reaches main silently.
      - run: pnpm typecheck

      - run: pnpm test

  # examples/get-started/* are what a user downloads: one project each, installed with npm from
  # the PUBLISHED packages. `pnpm build` above checks them against the packages about to ship;
  # this job checks them exactly as a user gets them today — install, build, and play in a browser.
  get-started-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Only for the browser the check borrows from examples/docs-examples.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pixodesk/example-docs-examples exec playwright install --with-deps chromium

      - run: pnpm check:get-started
